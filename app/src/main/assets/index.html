<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>دروسي</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,sans-serif}
.header{padding:18px 16px 22px;background:linear-gradient(135deg,#244cff,#7b5cff);color:#fff;border-radius:0 0 30px 30px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:54px;height:54px;border-radius:17px;background:#fff2;color:#fff;display:grid;place-items:center;font-size:31px;box-shadow:0 8px 25px #0002}.brand h1{margin:0;font-size:27px}.sub{margin-top:8px;opacity:.92}
.cover{margin-top:18px;background:#fff1;border:1px solid #ffffff33;border-radius:22px;padding:15px;display:flex;align-items:center;gap:12px}.coverArt{font-size:62px;line-height:1}.cover b{font-size:18px}.cover small{display:block;margin-top:5px;opacity:.9}
.wrap{padding:15px}.search{background:#fff;border:1px solid #e1e6f0;border-radius:16px;padding:14px;width:100%;font-size:16px;outline:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:14px 0}.card{background:#fff;border-radius:19px;padding:16px;box-shadow:0 5px 20px #1520440b;border:1px solid #edf0f6}.stat b{display:block;font-size:22px;margin-bottom:5px}.count{color:#737c8e;font-size:13px}
.section{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}.section h2{font-size:19px;margin:0}
.btn{border:0;background:#315cff;color:#fff;padding:13px 15px;border-radius:13px;font-size:15px;font-weight:bold}.btn2{background:#eef2ff;color:#315cff}.danger{background:#fff0f0;color:#c33}.bigbtn{width:100%;margin-top:9px}
.lesson{margin-bottom:10px}.lesson h3{margin:0 0 6px}.lesson p{line-height:1.7;margin:7px 0}.pill{display:inline-block;background:#eef2ff;color:#315cff;padding:7px 10px;border-radius:10px;font-size:12px}
.empty{text-align:center;color:#777;padding:30px}.fab{position:fixed;left:18px;bottom:72px;width:58px;height:58px;border:0;border-radius:50%;background:#315cff;color:#fff;font-size:28px;box-shadow:0 8px 25px #315cff55;z-index:6}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px}.sheet input,.sheet textarea,.sheet select{width:100%;padding:14px;border:1px solid #dfe3eb;border-radius:13px;margin:7px 0;font-size:16px}
.nav{position:fixed;bottom:0;right:0;left:0;background:#fff;border-top:1px solid #e5e8ef;display:flex;justify-content:space-around;padding:8px 0;z-index:10}.nav button{border:0;background:none;color:#697184;font-size:12px}.nav .active{color:#315cff;font-weight:bold}
.content{padding-bottom:75px}.audioBox{margin:16px 0;padding:16px;border-radius:20px;background:linear-gradient(180deg,#f3f6ff,#fff);border:1px solid #dfe6ff}.audioTitle{font-size:18px;font-weight:bold}.mic{font-size:42px;text-align:center;margin:7px}.recordStatus{text-align:center;color:#697184;font-size:13px;margin:7px}.recording{color:#d33;font-weight:bold}.lessonBody{white-space:pre-wrap;line-height:1.9}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
</style>
</head>
<body>
<div class="content">
<header class="header">
<div class="brand"><div class="logo">📚</div><div><h1>دروسي</h1><div class="sub">تعلمك ودروسك في مكان واحد</div></div></div>
<div class="cover"><div class="coverArt">🎓</div><div><b>دفتر الطالب الذكي</b><small>احفظ دروسك • سجّل صوتك • راجع واختبر نفسك</small></div></div>
</header>
<div class="wrap">
<input id="search" class="search" placeholder="🔎 ابحث عن درس أو مادة..." oninput="render()">
<div class="grid">
<div class="card stat"><b id="lessonCount">0</b><span class="count">درس محفوظ</span></div>
<div class="card stat"><b id="favCount">0</b><span class="count">درس مفضل</span></div>
<div class="card stat"><b id="quizCount">0</b><span class="count">اختبار تم حله</span></div>
<div class="card stat"><b id="progressCount">0%</b><span class="count">تقدم المراجعة</span></div>
</div>
<div class="section"><h2>المواد</h2><button class="btn btn2" onclick="addSubject()">+ مادة</button></div>
<div id="subjects" class="grid"></div>
<div class="section"><h2>آخر الدروس</h2></div>
<div id="lessons"></div>
</div></div>
<button class="fab" onclick="openLesson()">＋</button>

<div id="modal" class="modal"><div class="sheet"><h2>➕ إضافة درس</h2><input id="title" placeholder="عنوان الدرس"><select id="subject"></select><textarea id="body" rows="7" placeholder="اكتب الدرس هنا..."></textarea><button class="btn bigbtn" onclick="saveLesson()">حفظ الدرس</button><button class="btn btn2 bigbtn" onclick="closeModal()">إلغاء</button></div></div>

<div id="detailModal" class="modal"><div class="sheet">
<h2 id="detailTitle"></h2><div id="detailSubject" class="count"></div><p id="detailBody" class="lessonBody"></p>
<div class="audioBox">
<div class="audioTitle">🎙️ تسجيل صوتي</div><div class="mic">🎤</div>
<div id="recordStatus" class="recordStatus">لا يوجد تسجيل لهذا الدرس</div>
<button id="recordBtn" class="btn bigbtn" onclick="toggleRecord()">🔴 بدء التسجيل بالميكروفون</button>
<button id="playBtn" class="btn btn2 bigbtn" onclick="togglePlay()">▶️ تشغيل التسجيل</button>
<button class="btn danger bigbtn" onclick="deleteRecord()">🗑️ حذف التسجيل</button>
</div>
<div class="actions"><button class="btn btn2" onclick="speakLesson()">🔊 قراءة النص</button><button class="btn btn2" onclick="openFlashcard()">🃏 بطاقة</button><button class="btn btn2" onclick="openQuiz()">📝 اختبار</button><button class="btn btn2" onclick="favCurrent()">⭐ المفضلة</button></div>
<button class="btn btn2 bigbtn" onclick="closeDetail()">إغلاق</button>
</div></div>

<div id="flashModal" class="modal"><div class="sheet"><h2>🃏 بطاقة مراجعة</h2><div id="flashFront" class="card" style="font-size:20px;text-align:center;min-height:130px;display:flex;align-items:center;justify-content:center"></div><button class="btn bigbtn" onclick="flipFlash()">🔄 إظهار الإجابة</button><button class="btn btn2 bigbtn" onclick="closeFlash()">إغلاق</button></div></div>
<div id="quizModal" class="modal"><div class="sheet"><h2>📝 اختبار سريع</h2><div id="quizArea"></div><button class="btn bigbtn" onclick="checkQuiz()">تصحيح الاختبار</button><button class="btn btn2 bigbtn" onclick="closeQuiz()">إغلاق</button></div></div>
<div class="nav"><button class="active" onclick="showAll()">🏠<br>الرئيسية</button><button onclick="filterFav()">⭐<br>المفضلة</button><button onclick="showAll()">📖<br>الدروس</button><button onclick="openLesson()">➕<br>إضافة</button></div>

<script>
const key='doroosi-data';let data=JSON.parse(localStorage.getItem(key)||'{"subjects":["الرياضيات","العربية","العلوم"],"lessons":[]}');let currentId=null,isRecording=false,isPlaying=false;
function save(){localStorage.setItem(key,JSON.stringify(data))}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let q=(document.getElementById('search').value||'').trim();document.getElementById('subjects').innerHTML=data.subjects.map(s=>'<div class="card" onclick="showSubject(\''+esc(s)+'\')"><b>📘 '+esc(s)+'</b><span class="count">'+data.lessons.filter(x=>x.subject===s).length+' دروس</span></div>').join('');let ls=data.lessons.filter(x=>!q||x.title.includes(q)||x.subject.includes(q)||x.body.includes(q)).slice().reverse();document.getElementById('lessonCount').textContent=data.lessons.length;document.getElementById('favCount').textContent=data.lessons.filter(x=>x.fav).length;document.getElementById('lessons').innerHTML=ls.length?ls.map(x=>'<div class="card lesson" onclick="openDetail(\''+x.id+'\')"><h3>'+esc(x.title)+'</h3><span class="count">'+esc(x.subject)+'</span><p>'+esc(x.body.slice(0,130))+(x.body.length>130?'…':'')+'</p><span class="pill">'+(x.fav?'⭐ مفضل':'اضغط لفتح الدرس')+'</span></div>').join(''):'<div class="empty">لا توجد دروس بعد.<br>اضغط ＋ لإضافة أول درس.</div>';stats()}
function openLesson(){document.getElementById('subject').innerHTML=data.subjects.map(s=>'<option>'+esc(s)+'</option>').join('');document.getElementById('modal').style.display='flex'}function closeModal(){document.getElementById('modal').style.display='none'}
function saveLesson(){let title=document.getElementById('title').value.trim(),body=document.getElementById('body').value.trim(),subject=document.getElementById('subject').value;if(!title||!body)return alert('اكتب عنوان الدرس ومحتواه');let id=Date.now().toString();data.lessons.push({id,title,body,subject,fav:false});save();document.getElementById('title').value='';document.getElementById('body').value='';closeModal();render();openDetail(id)}
function fav(id){let x=data.lessons.find(a=>a.id===id);if(x){x.fav=!x.fav;save();render()}}function addSubject(){let s=prompt('اسم المادة:');if(s&&s.trim()&&!data.subjects.includes(s.trim())){data.subjects.push(s.trim());save();render()}}function showSubject(s){document.getElementById('search').value=s;render()}function showAll(){document.getElementById('search').value='';render()}
function filterFav(){document.getElementById('search').value='';let ls=data.lessons.filter(x=>x.fav).reverse();document.getElementById('lessons').innerHTML=ls.length?ls.map(x=>'<div class="card lesson" onclick="openDetail(\''+x.id+'\')"><h3>'+esc(x.title)+'</h3><span class="count">'+esc(x.subject)+'</span><p>'+esc(x.body)+'</p></div>').join(''):'<div class="empty">لا توجد دروس مفضلة.</div>'}
function openDetail(id){currentId=id;let x=data.lessons.find(a=>a.id===id);if(!x)return;document.getElementById('detailTitle').textContent=x.title;document.getElementById('detailSubject').textContent=x.subject;document.getElementById('detailBody').textContent=x.body;document.getElementById('detailModal').style.display='flex';updateAudioUI()}
function closeDetail(){if(isPlaying&&window.Android)Android.stopPlayback();document.getElementById('detailModal').style.display='none';currentId=null;isPlaying=false}
function hasRec(){return !!(window.Android&&currentId&&Android.hasRecording(currentId))}
function updateAudioUI(){let e=hasRec();document.getElementById('recordStatus').textContent=isRecording?'🔴 جارٍ التسجيل... تحدث الآن':e?'✅ يوجد تسجيل محفوظ لهذا الدرس':'لا يوجد تسجيل لهذا الدرس';document.getElementById('recordBtn').textContent=isRecording?'⏹️ إيقاف التسجيل':'🔴 بدء التسجيل بالميكروفون';document.getElementById('recordBtn').className=isRecording?'btn danger bigbtn':'btn bigbtn';document.getElementById('playBtn').textContent=isPlaying?'⏹️ إيقاف الاستماع':'▶️ تشغيل التسجيل';document.getElementById('playBtn').disabled=!e&&!isPlaying}
function toggleRecord(){if(!window.Android)return alert('هذه النسخة لا تدعم التسجيل الصوتي.');if(isRecording)Android.stopRecording();else Android.startRecording(currentId)}
function togglePlay(){if(!window.Android)return;if(isPlaying)Android.stopPlayback();else if(hasRec())Android.playRecording(currentId)}
function deleteRecord(){if(window.Android&&currentId&&hasRec()&&confirm('حذف التسجيل؟'))Android.deleteRecording(currentId)}
function favCurrent(){if(currentId)fav(currentId)}function speakLesson(){let x=data.lessons.find(a=>a.id===currentId);if(!x)return;if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(x.title+' . '+x.body);u.lang='ar-SA';speechSynthesis.speak(u)}}
window.onRecordingStarted=()=>{isRecording=true;updateAudioUI()};window.onRecordingStopped=()=>{isRecording=false;updateAudioUI()};window.onRecordingPlaybackStarted=()=>{isPlaying=true;updateAudioUI()};window.onRecordingPlaybackStopped=()=>{isPlaying=false;updateAudioUI()};window.onRecordingDeleted=()=>{isPlaying=false;updateAudioUI()};window.onRecordingPermissionDenied=()=>{isRecording=false;updateAudioUI();alert('السماح بالميكروفون مطلوب. افتح إعدادات الهاتف ← التطبيقات ← دروسي ← الأذونات ← الميكروفون ← السماح.')};window.onRecordingError=m=>{isRecording=false;updateAudioUI();alert(m||'تعذر التسجيل')}
let flashAnswer=false,quizLesson=null;
function stats(){document.getElementById('quizCount').textContent=Number(localStorage.getItem('doroosi-quizzes')||0);let r=Number(localStorage.getItem('doroosi-reviewed')||0);document.getElementById('progressCount').textContent=Math.min(100,Math.round(r/Math.max(1,data.lessons.length)*100))+'%'}
function openFlashcard(){let x=data.lessons.find(a=>a.id===currentId);if(!x)return;flashAnswer=false;document.getElementById('flashFront').textContent='❓ '+x.title+' — حاول تذكر الإجابة';document.getElementById('flashModal').style.display='flex'}
function flipFlash(){let x=data.lessons.find(a=>a.id===currentId);if(!x)return;flashAnswer=!flashAnswer;document.getElementById('flashFront').textContent=flashAnswer?'✅ '+x.body:'❓ '+x.title+' — حاول تذكر الإجابة';if(flashAnswer){localStorage.setItem('doroosi-reviewed',Number(localStorage.getItem('doroosi-reviewed')||0)+1);stats()}}
function closeFlash(){document.getElementById('flashModal').style.display='none'}function openQuiz(){let x=data.lessons.find(a=>a.id===currentId);if(!x)return;quizLesson=x;document.getElementById('quizArea').innerHTML='<p><b>السؤال:</b> ما عنوان هذا الدرس؟</p><input id="quizAnswer" class="search" placeholder="اكتب إجابتك هنا">';document.getElementById('quizModal').style.display='flex'}function checkQuiz(){if(!quizLesson)return;let a=(document.getElementById('quizAnswer').value||'').trim().toLowerCase();let ok=a===quizLesson.title.trim().toLowerCase();localStorage.setItem('doroosi-quizzes',Number(localStorage.getItem('doroosi-quizzes')||0)+1);document.getElementById('quizArea').innerHTML=ok?'🎉 إجابة صحيحة! أحسنت.':'❌ ليست مطابقة. راجع الدرس وحاول مرة أخرى.';stats()}function closeQuiz(){document.getElementById('quizModal').style.display='none'}
render();
</script>
</body></html>

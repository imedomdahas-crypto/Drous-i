<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>دروسي</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#172033;font-family:Arial,sans-serif}header{background:#315cff;color:#fff;padding:28px 18px 22px;border-radius:0 0 24px 24px}h1{margin:0 0 7px;font-size:28px}.sub{opacity:.9}.wrap{padding:16px}.search{background:#fff;border:1px solid #e4e7ef;border-radius:15px;padding:13px 15px;width:100%;font-size:16px;outline:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.card{background:#fff;border-radius:18px;padding:17px;box-shadow:0 3px 14px #0000000a;border:1px solid #edf0f6}.card b{display:block;font-size:19px;margin-bottom:5px}.count{color:#6d7587;font-size:13px}.btn{border:0;background:#315cff;color:#fff;padding:12px 15px;border-radius:12px;font-size:15px}.btn2{background:#eef2ff;color:#315cff}.danger{background:#fff0f0;color:#c33}.section{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}.lesson{margin-bottom:10px}.lesson h3{margin:0 0 6px}.empty{color:#777;text-align:center;padding:30px}.fab{position:fixed;left:18px;bottom:20px;width:58px;height:58px;border:0;border-radius:50%;background:#315cff;color:white;font-size:28px;box-shadow:0 8px 25px #315cff55}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:10}.sheet{background:#fff;width:100%;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px}.sheet input,.sheet textarea,.sheet select{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;margin:7px 0;font-size:16px}.nav{position:fixed;bottom:0;right:0;left:0;background:#fff;border-top:1px solid #e6e8ef;display:flex;justify-content:space-around;padding:9px 0;z-index:5}.nav button{border:0;background:none;color:#697184;font-size:13px}.nav .active{color:#315cff;font-weight:bold}.content{padding-bottom:75px}.pill{display:inline-block;background:#eef2ff;color:#315cff;padding:7px 10px;border-radius:10px;font-size:12px;margin-top:8px}.audioBox{background:#f7f8fc;border-radius:16px;padding:14px;margin:12px 0}.recordStatus{font-size:13px;color:#666;margin:8px 0}.recording{color:#d33;font-weight:bold}.bigbtn{width:100%;margin-top:8px}.lessonBody{white-space:pre-wrap;line-height:1.8}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions .btn{flex:1;min-width:120px}
</style></head><body><div class="content"><header><h1>📚 دروسي</h1><div class="sub">مكانك الخاص لحفظ الدروس والمراجعة</div></header><div class="wrap"><input id="search" class="search" placeholder="ابحث عن درس أو مادة..." oninput="render()"><div class="grid"><div class="card"><b id="lessonCount">0</b><span class="count">درس محفوظ</span></div><div class="card"><b id="favCount">0</b><span class="count">درس مفضل</span></div><div class="card"><b id="quizCount">0</b><span class="count">اختبار تم حله</span></div><div class="card"><b id="progressCount">0%</b><span class="count">تقدم المراجعة</span></div></div><div class="section"><h2>المواد</h2><button class="btn btn2" onclick="addSubject()">+ مادة</button></div><div id="subjects" class="grid"></div><div class="section"><h2>آخر الدروس</h2></div><div id="lessons"></div></div></div><button class="fab" onclick="openLesson()">＋</button>
<div id="modal" class="modal"><div class="sheet"><h2>إضافة درس</h2><input id="title" placeholder="عنوان الدرس"><select id="subject"></select><textarea id="body" rows="7" placeholder="اكتب الدرس هنا..."></textarea><button class="btn bigbtn" onclick="saveLesson()">حفظ الدرس</button><button class="btn btn2 bigbtn" onclick="closeModal()">إلغاء</button></div></div>
<div id="detailModal" class="modal"><div class="sheet"><h2 id="detailTitle"></h2><div id="detailSubject" class="count"></div><p id="detailBody" class="lessonBody"></p><div class="audioBox"><b>🎙️ التسجيل الصوتي للدرس</b><div id="recordStatus" class="recordStatus">لا يوجد تسجيل بعد.</div><button id="recordBtn" class="btn bigbtn" onclick="toggleRecord()">🔴 بدء التسجيل</button><button id="playBtn" class="btn btn2 bigbtn" onclick="togglePlay()">▶️ استماع للتسجيل</button><button class="btn danger bigbtn" onclick="deleteRecord()">🗑️ حذف التسجيل</button></div><div class="actions"><button class="btn btn2" onclick="speakLesson()">🔊 قراءة النص بصوت</button><button class="btn btn2" onclick="openFlashcard()">🃏 بطاقة مراجعة</button><button class="btn btn2" onclick="openQuiz()">📝 اختبار</button><button class="btn btn2" onclick="favCurrent()">⭐ المفضلة</button><button class="btn btn2" onclick="closeDetail()">إغلاق</button></div></div></div>
<div id="flashModal" class="modal"><div class="sheet"><h2>🃏 بطاقة مراجعة</h2><div id="flashFront" class="card" style="font-size:20px;text-align:center;min-height:120px;display:flex;align-items:center;justify-content:center"></div><button class="btn bigbtn" onclick="flipFlash()">🔄 إظهار الإجابة</button><button class="btn btn2 bigbtn" onclick="closeFlash()">إغلاق</button></div></div>
<div id="quizModal" class="modal"><div class="sheet"><h2>📝 اختبار سريع</h2><div id="quizArea"></div><button class="btn bigbtn" onclick="checkQuiz()">تصحيح الاختبار</button><button class="btn btn2 bigbtn" onclick="closeQuiz()">إغلاق</button></div></div>
<div class="nav"><button class="active" onclick="showAll()">🏠<br>الرئيسية</button><button onclick="filterFav()">⭐<br>المفضلة</button><button onclick="showAll()">📖<br>كل الدروس</button><button onclick="openLesson()">➕<br>إضافة</button></div>
<script>
const key='doroosi-data';let data=JSON.parse(localStorage.getItem(key)||'{"subjects":["الرياضيات","العربية","العلوم"],"lessons":[]}');let currentId=null;let isRecording=false;let isPlaying=false;
function save(){localStorage.setItem(key,JSON.stringify(data))}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let q=(document.getElementById('search').value||'').trim();let ss=document.getElementById('subjects');ss.innerHTML=data.subjects.map(s=>`<div class="card" onclick="showSubject('${esc(s)}')"><b>📘 ${esc(s)}</b><span class="count">${data.lessons.filter(x=>x.subject===s).length} دروس</span></div>`).join('');let ls=data.lessons.filter(x=>!q||x.title.includes(q)||x.subject.includes(q)||x.body.includes(q)).slice().reverse();document.getElementById('lessonCount').textContent=data.lessons.length;document.getElementById('favCount').textContent=data.lessons.filter(x=>x.fav).length;document.getElementById('lessons').innerHTML=ls.length?ls.map(x=>`<div class="card lesson" onclick="openDetail('${x.id}')"><h3>${esc(x.title)}</h3><span class="count">${esc(x.subject)}</span><p>${esc(x.body.slice(0,130))}${x.body.length>130?'…':''}</p><span class="pill">${x.fav?'⭐ مفضل':'اضغط لفتح الدرس'}</span></div>`).join(''):'<div class="empty">لا توجد دروس بعد. اضغط + لإضافة أول درس.</div>'}
function openLesson(){document.getElementById('subject').innerHTML=data.subjects.map(s=>`<option>${esc(s)}</option>`).join('');document.getElementById('modal').style.display='flex'}function closeModal(){document.getElementById('modal').style.display='none'}
function saveLesson(){let title=document.getElementById('title').value.trim(),body=document.getElementById('body').value.trim(),subject=document.getElementById('subject').value;if(!title||!body)return alert('اكتب عنوان الدرس ومحتواه');data.lessons.push({id:Date.now().toString(),title,body,subject,fav:false});save();document.getElementById('title').value='';document.getElementById('body').value='';closeModal();render()}
function fav(id){let x=data.lessons.find(a=>a.id===id);if(x){x.fav=!x.fav;save();render()}}function addSubject(){let s=prompt('اسم المادة:');if(s&&s.trim()&&!data.subjects.includes(s.trim())){data.subjects.push(s.trim());save();render()}}function showSubject(s){document.getElementById('search').value=s;render()}
function filterFav(){document.getElementById('search').value='';document.getElementById('lessons').innerHTML=data.lessons.filter(x=>x.fav).reverse().map(x=>`<div class="card lesson" onclick="openDetail('${x.id}')"><h3>${esc(x.title)}</h3><span class="count">${esc(x.subject)}</span><p>${esc(x.body)}</p></div>`).join('')||'<div class="empty">لا توجد دروس مفضلة.</div>'}function showAll(){document.getElementById('search').value='';render()}
function openDetail(id){currentId=id;let x=data.lessons.find(a=>a.id===id);if(!x)return;document.getElementById('detailTitle').textContent=x.title;document.getElementById('detailSubject').textContent=x.subject;document.getElementById('detailBody').textContent=x.body;document.getElementById('detailModal').style.display='flex';updateAudioUI()}
function closeDetail(){if(isPlaying&&window.Android)Android.stopPlayback();document.getElementById('detailModal').style.display='none';currentId=null;isPlaying=false}
function hasRec(){return !!(window.Android&&currentId&&Android.hasRecording(currentId))}function updateAudioUI(){let exists=hasRec();document.getElementById('recordStatus').textContent=exists?'يوجد تسجيل محفوظ لهذا الدرس.':'لا يوجد تسجيل بعد.';document.getElementById('recordBtn').textContent=isRecording?'⏹️ إيقاف التسجيل':'🔴 بدء التسجيل';document.getElementById('recordBtn').className=isRecording?'btn danger bigbtn':'btn bigbtn';document.getElementById('playBtn').textContent=isPlaying?'⏹️ إيقاف الاستماع':'▶️ استماع للتسجيل';document.getElementById('playBtn').disabled=!exists&&!isPlaying}
function toggleRecord(){if(!window.Android)return alert('ميزة التسجيل تعمل في تطبيق Android.');if(isRecording){Android.stopRecording()}else{Android.startRecording(currentId)}}function togglePlay(){if(!window.Android)return;if(isPlaying){Android.stopPlayback();isPlaying=false;updateAudioUI()}else if(hasRec()){Android.playRecording(currentId)}}function deleteRecord(){if(window.Android&&currentId&&hasRec()){if(confirm('حذف التسجيل؟'))Android.deleteRecording(currentId)}}
function favCurrent(){if(currentId)fav(currentId)}function speakLesson(){let x=data.lessons.find(a=>a.id===currentId);if(!x)return;if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(x.title+' . '+x.body);u.lang='ar-SA';speechSynthesis.speak(u)}else alert('قراءة النص بصوت غير متاحة على هذا الجهاز.')}
window.onRecordingStarted=()=>{isRecording=true;updateAudioUI();document.getElementById('recordStatus').textContent='🔴 جارٍ التسجيل... تحدث الآن.'};window.onRecordingStopped=()=>{isRecording=false;updateAudioUI()};window.onRecordingPlaybackStarted=()=>{isPlaying=true;updateAudioUI()};window.onRecordingPlaybackStopped=()=>{isPlaying=false;updateAudioUI()};window.onRecordingDeleted=()=>{isPlaying=false;isRecording=false;updateAudioUI()};window.onRecordingPermissionDenied=()=>alert('يجب السماح للتطبيق باستخدام الميكروفون حتى يعمل التسجيل.');window.onRecordingError=(m)=>{isRecording=false;updateAudioUI();alert('تعذر التسجيل: '+m)};
let flashAnswer=false;let quizLesson=null;let quizScore=0;
function stats(){let q=Number(localStorage.getItem('doroosi-quizzes')||0);let reviewed=Number(localStorage.getItem('doroosi-reviewed')||0);document.getElementById('quizCount').textContent=q;document.getElementById('progressCount').textContent=Math.min(100,Math.round((reviewed/Math.max(1,data.lessons.length))*100))+'%'}
function openFlashcard(){let x=data.lessons.find(a=>a.id===currentId);if(!x)return;flashAnswer=false;document.getElementById('flashFront').textContent='❓ '+x.title+' — حاول تذكر أهم النقاط قبل رؤية الإجابة';document.getElementById('flashModal').style.display='flex'}
function flipFlash(){let x=data.lessons.find(a=>a.id===currentId);if(!x)return;flashAnswer=!flashAnswer;document.getElementById('flashFront').textContent=flashAnswer?'✅ '+x.body:'❓ '+x.title+' — حاول تذكر الإجابة';if(flashAnswer){localStorage.setItem('doroosi-reviewed',Number(localStorage.getItem('doroosi-reviewed')||0)+1);stats()}}
function closeFlash(){document.getElementById('flashModal').style.display='none'}
function openQuiz(){let x=data.lessons.find(a=>a.id===currentId);if(!x)return;quizLesson=x;let answer=x.title;document.getElementById('quizArea').innerHTML='<p><b>السؤال:</b> ما عنوان هذا الدرس؟</p><input id="quizAnswer" class="search" placeholder="اكتب إجابتك هنا"><p class="count">سيتم اعتبار الإجابة صحيحة إذا كتبت عنوان الدرس.</p>';document.getElementById('quizModal').style.display='flex'}
function checkQuiz(){if(!quizLesson)return;let a=(document.getElementById('quizAnswer').value||'').trim().toLowerCase(),b=quizLesson.title.trim().toLowerCase();quizScore=a===b?1:0;localStorage.setItem('doroosi-quizzes',Number(localStorage.getItem('doroosi-quizzes')||0)+1);document.getElementById('quizArea').innerHTML=quizScore?'🎉 إجابة صحيحة! أحسنت.':'❌ ليست مطابقة تمامًا. راجع عنوان الدرس وحاول مرة أخرى.';stats()}
function closeQuiz(){document.getElementById('quizModal').style.display='none'}
const oldRender=render; render=function(){oldRender();stats()};
render();
</script></body></html>
